name: Display visual convergence review

on:
  push:
    branches:
      - feat/display-visual-convergence

permissions:
  contents: read

jobs:
  capture:
    name: Capture review frames
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Capture principal display states
        run: CQS_DISPLAY_VISUAL_REVIEW=1 npx playwright test tests/e2e/display-visual-convergence-review.spec.ts --project=desktop-1080p --project=projector-720p

      - name: Upload review frames
        uses: actions/upload-artifact@v4
        with:
          name: display-visual-convergence-review
          path: test-results/display-visual-review
          retention-days: 7
