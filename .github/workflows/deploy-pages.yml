name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the official GitHub Pages deployment flow.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Lifecycle ticket only — no Google / clasp / Nolan credentials in Actions.
      # School Mac consumes the ticket with existing school identity (Option B).
      - uses: actions/checkout@v4

      - name: Emit Overwatch registration ticket
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts
          node scripts/emit-overwatch-registration-ticket.mjs \
            --sha "${{ github.sha }}" \
            --pages-url "${{ steps.deployment.outputs.page_url }}" \
            --out artifacts/overwatch-registration-ticket.json

      - name: Upload Overwatch registration ticket
        uses: actions/upload-artifact@v4
        with:
          name: overwatch-registration-ticket
          path: artifacts/overwatch-registration-ticket.json
          if-no-files-found: error
          retention-days: 30
